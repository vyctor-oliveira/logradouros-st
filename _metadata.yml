title: Logradouros de Serra Talhada
description_html: |-
  <p>Uma maneira mais rápida de visualizar todos as ruas, avenidas, travessas e semelhantes da cidade de Serra Talhada, Pernambuco.</p>
  <br>
  <p><a href="https://www.google.com/maps/d/u/0/viewer?mid=1c2ju_HcCjBugKl4mwtXQ9lET2bHofd1O&ll=-8.002444472319501%2C-38.290630626708996&z=13" target=_blank >Dados originais</a> pela Secretaria de Finanças da Prefeitura Municipal de Serra Talhada.
